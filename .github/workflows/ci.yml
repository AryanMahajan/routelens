name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runtime enrich's end-to-end tests import the Flask and FastAPI fixtures for real,
      # and skip themselves without an interpreter that can. Give them one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the fixtures' dependencies
        run: pip install -r tests/fixtures/flask/requirements.txt -r tests/fixtures/fastapi/requirements.txt -r tests/fixtures/django/requirements.txt

      - name: Test
        run: cargo test --workspace
        env:
          ROUTELENS_TEST_PYTHON: python

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

  # Discovery accuracy is invisible to the other jobs: a route that quietly stops being found
  # produces no error, just a shorter list. Once fixtures land in P3 this job is the guard.
  fixtures:
    name: Discovery fixtures
    runs-on: ubuntu-latest
    if: hashFiles('tests/fixtures/**') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rl-discovery --test fixtures
