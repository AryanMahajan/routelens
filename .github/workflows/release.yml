name: Release

# Runs only when a version tag is pushed (or started by hand) — never on ordinary pushes to
# main. Builds the installers on every platform and attaches them to one GitHub Release.
#
#   git tag v0.1.0-alpha.1
#   git push origin v0.1.0-alpha.1
#
# The binaries are unsigned: see docs/getting-started.md for the warnings each OS shows and
# how to get past them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-13
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a manual run there is no tag; fall back to the version in tauri.conf.json.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: RouteLens ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Unsigned pre-release build. Your OS will warn before the first launch:

            - **Windows:** SmartScreen — click *More info* → *Run anyway*.
            - **macOS:** right-click the app → *Open* → *Open*, or allow it under
              *System Settings → Privacy & Security*.
            - **Linux:** `chmod +x` the AppImage, or install the `.deb` / `.rpm`.

            See the [getting started guide](https://github.com/AryanMahajan/routelens/blob/main/docs/getting-started.md).
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
